services:
  - type: web
    name: zenith-atelier-backend
    env: node
    buildCommand: npm install && npm install --workspace=backend && npm run build:backend
    startCommand: cd backend && node dist/index.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: zenith-atelier-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://your-app.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@zenith-atelier.com
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: zenith-atelier-frontend
    env: static
    buildCommand: npm install && npm install --workspace=frontend && npm run build:frontend
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://zenith-atelier-backend.onrender.com

databases:
  - name: zenith-atelier-db
    databaseName: zenith_atelier
    user: zenith_user
